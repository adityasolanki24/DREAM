[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dream"
version = "0.1.0"
description = "DREAM: a robot that learns how unfamiliar mechanisms work by experimenting on them."
requires-python = ">=3.10"
dependencies = [
    "mujoco==3.16.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
demo = ["pillow==13.0.0"]  # MIT-CMU; optional original-frame and annotation pipeline
dataset = ["pyarrow==22.0.0"]  # Apache-2.0; optional LeRobot v2 Parquet export, CPU only
# Separate loader-validation environment; incompatible with the older VLM Torch pin.
# BSD-3-Clause packages; requires external FFmpeg 4–7 shared libraries on Windows.
loader = ["pandas==2.3.3", "pyarrow==22.0.0", "torch==2.9.0", "torchcodec==0.8.1"]
locomotion = ["onnxruntime==1.23.2"]  # MIT; optional CPU T1 actor, separate Isaac environment
# Hydra's scene-graph library (MIT-SPARK/Spark-DSG, BSD); dream/memory/scene_graph.py.
scenegraph = ["spark-dsg==1.1.3"]
# Local Qwen3-VL inference (dream/runtime/qwen.py). Not needed by the CPU test suite.
# The validated GPU pilot uses a separate hashed Linux lockfile.
vlm = ["torch==2.8.0", "torchvision==0.23.0", "transformers==4.57.1", "pillow==11.3.0"]
vla = ["torch==2.8.0", "torchvision==0.23.0", "transformers==4.57.1", "pillow==11.3.0", "accelerate==1.11.0", "einops==0.8.1"]

[tool.setuptools.packages.find]
include = ["dream*"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Immutable experiment source snapshots retain the exact bytes that ran.
extend-exclude = ["results/**/source/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: long-running simulation tests (deselect with -m 'not slow')"]

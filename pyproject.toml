[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dream"
version = "0.1.0"
description = "DREAM: a robot that learns how unfamiliar mechanisms work by experimenting on them."
requires-python = ">=3.10"
dependencies = [
    "mujoco==3.16.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Local Qwen3-VL inference (dream/runtime/qwen.py). Not needed by the test suite; not yet
# installed or run in the development environment (no route to the model weights).
vlm = ["torch>=2.6", "transformers>=4.57", "pillow>=10"]

[tool.setuptools.packages.find]
include = ["dream*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: long-running simulation tests (deselect with -m 'not slow')"]
